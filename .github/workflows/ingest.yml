name: Ingest

on:
  schedule:
    # Sun 23:00 and Mon 06:00 UTC — brackets every race-weekend finish across all time zones.
    - cron: '0 23 * * 0'
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      round:
        description: 'Round to backfill (blank = diff mode: bake every completed round missing from the index)'
        required: false
        type: string

# Commit the freshly baked replay files back to main.
permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bake replay data
        # Pass the input through the environment (never interpolated into the shell) to avoid
        # script injection. Blank round = no-arg diff mode.
        env:
          ROUND: ${{ inputs.round }}
        run: |
          if [ -n "$ROUND" ]; then
            npm run ingest -- --round "$ROUND"
          else
            npm run ingest
          fi
      - name: Commit new replays
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/replays
          if git diff --cached --quiet; then
            echo 'No new race data — nothing to commit.'
          else
            git commit -m 'Ingest: bake new replay data'
            git push
          fi
