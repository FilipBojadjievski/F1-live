name: Deploy

on:
  push:
    branches: [main]
  # Ingest pushes baked races with the default GITHUB_TOKEN, which does not re-fire `push`.
  # Chaining off its completion redeploys the site once new data lands.
  workflow_run:
    workflows: [Ingest]
    types: [completed]

# Least privilege for the official Pages actions: read the repo, publish Pages, mint the OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # For the chained run, only publish when the ingest that triggered us actually succeeded.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback: Pages serves 404.html for unknown paths. A copy of index.html makes deep
      # links (e.g. /F1-live/replay/12) boot the app and let react-router resolve them.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
